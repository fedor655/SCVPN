# Проект собирается XcodeGen из этого файла: project.pbxproj — машинный файл на
# тысячи строк с UUID-ключами, его не правит надёжно ни человек, ни агент, а
# конфликт слияния в нём неразрешим. Здесь же видно всё разом.
#
# Пересобрать: cd ios && xcodegen generate
name: SCVPN
options:
  bundleIdPrefix: com.scvpn
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  SCVPNCore:
    path: ../core-swift
  # Мост TUN <-> SOCKS: обёртка над hev-socks5-tunnel, та же библиотека, что на
  # Android. Лицензия MIT.
  Tun2SocksKit:
    url: https://github.com/EbrahimTahernejad/Tun2SocksKit
    branch: main

targets:
  # Ядро Xray, завёрнутое в свой динамический фреймворк.
  #
  # Зачем обёртка: LibXray.xcframework — статическая библиотека с модульной
  # картой, и каждый таргет, который её линкует, копирует заголовки в общий
  # каталог include. Два таргета дают «Multiple commands produce
  # .../include/module.modulemap». Здесь ядро обрабатывается один раз, а
  # приложение и расширение зависят уже от обёртки — заодно ядро лежит в
  # бандле в единственном экземпляре.
  LibXrayKit:
    type: framework
    platform: iOS
    sources:
      - path: LibXrayKit/Sources/LibXrayKit
      - path: LibXrayKit/Sources/LibXrayKit/include
        headerVisibility: public
    dependencies:
      # Go-runtime внутри ядра зовёт res_9_ninit — резолвер BSD.
      - sdk: libresolv.tbd
    # Без своего Info.plist бандл фреймворка собирается без него, и система
    # отказывается ставить приложение: «Info.plist missing».
    info:
      path: LibXrayKit/Info.plist
      properties:
        CFBundleShortVersionString: "26.7.28"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scvpn.ios.LibXrayKit
        DEFINES_MODULE: "YES"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        # Библиотека линкуется флагами, а не зависимостью: так её заголовки не
        # попадают в общий include и не спорят с hev-socks5-tunnel.
        OTHER_LDFLAGS: -lXray
        SWIFT_OBJC_INTERFACE_HEADER_NAME: LibXrayKit-Swift.h
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/Frameworks/LibXray.xcframework/ios-arm64
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/Frameworks/LibXray.xcframework/ios-arm64_x86_64-simulator

  SCVPN:
    type: application
    platform: iOS
    sources:
      - path: SCVPN
      - path: Shared
    dependencies:
      - package: SCVPNCore
        product: SCVPNCore
      - target: PacketTunnel
      # Ядро нужно и приложению: подбор отпечатка и замер задержки идут здесь,
      # у приложения нет лимита памяти расширения.
      - target: LibXrayKit
        embed: true
    info:
      path: SCVPN/Info.plist
      properties:
        CFBundleDisplayName: SCVPN
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Без этого система считает приложение английским и подписывает свои
        # кнопки по-английски: свайп по списку давал «Delete» рядом с русским
        # текстом, а выбор файла — «Cancel».
        # Русский — единственный язык бандла, как и у macOS- и Android-версий:
        # тексты зашиты в код по-русски, и системные надписи не должны
        # разъезжаться с ними на телефоне с другим языком.
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Камера нужна сканеру QR. Без описания система убивает приложение при
        # первом обращении к камере, а не показывает запрос.
        NSCameraUsageDescription: Камера нужна, чтобы отсканировать QR-код с настройками сервера.
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scvpn.ios
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc подписи для симулятора достаточно: NetworkExtension там всё
        # равно не работает, а команду разработчика подставит Xcode на железе.
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    dependencies:
      - package: SCVPNCore
        product: SCVPNCore
      - package: Tun2SocksKit
        product: Tun2SocksKit
      # Внутри бандла приложения фреймворк уже есть — второй копии не нужно.
      # Фреймворк уже лежит в бандле приложения — второй копии не нужно.
      - target: LibXrayKit
        embed: false
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: SCVPN Tunnel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scvpn.ios.PacketTunnel
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  SCVPN:
    build:
      targets:
        SCVPN: all
    run:
      config: Debug
