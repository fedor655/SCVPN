# Проект собирается XcodeGen из этого файла: project.pbxproj — машинный файл на
# тысячи строк с UUID-ключами, его не правит надёжно ни человек, ни агент, а
# конфликт слияния в нём неразрешим. Здесь же видно всё разом.
#
# Пересобрать: cd ios && xcodegen generate
name: SCVPN
options:
  bundleIdPrefix: com.scvpn
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  SCVPNCore:
    path: ../core-swift

targets:
  SCVPN:
    type: application
    platform: iOS
    sources:
      - path: SCVPN
      - path: Shared
    dependencies:
      - package: SCVPNCore
        product: SCVPNCore
      - target: PacketTunnel
    info:
      path: SCVPN/Info.plist
      properties:
        CFBundleDisplayName: SCVPN
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Камера нужна сканеру QR. Без описания система убивает приложение при
        # первом обращении к камере, а не показывает запрос.
        NSCameraUsageDescription: Камера нужна, чтобы отсканировать QR-код с настройками сервера.
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scvpn.ios
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc подписи для симулятора достаточно: NetworkExtension там всё
        # равно не работает, а команду разработчика подставит Xcode на железе.
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    dependencies:
      - package: SCVPNCore
        product: SCVPNCore
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: SCVPN Tunnel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scvpn.ios.PacketTunnel
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  SCVPN:
    build:
      targets:
        SCVPN: all
    run:
      config: Debug
